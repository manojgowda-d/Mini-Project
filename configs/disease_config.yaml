# Disease Classification Configuration

dataset:
  raw_dir: "data/raw/disease"
  processed_dir: "data/disease"
  train_dir: "data/disease/train"
  val_dir: "data/disease/val"
  test_dir: "data/disease/test"
  split_ratio: [0.7, 0.15, 0.15]
  seed: 42

model:
  architecture: "resnet18"  # Options: resnet18, mobilenet_v3_small, mobilenet_v3_large
  pretrained: false
  num_classes: null  # Auto-detected from dataset if null
  dropout_rate: 0.3

training:
  image_size: 224
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # Options: adam, sgd, adamw
  early_stopping_patience: 5
  device: "auto"    # Options: auto, cuda, cpu

paths:
  checkpoint_dir: "models/cnn"
  best_model_path: "models/cnn/best_disease_model.pth"
  class_mapping_path: "models/cnn/class_mapping.json"
  metrics_output_path: "models/cnn/evaluation_metrics.json"
